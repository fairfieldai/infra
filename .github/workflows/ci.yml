# Terraform format, validate, and lint. None of the jobs need AWS credentials:
# validate runs init -backend=false and tflint only reads the configuration.

name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to a pull request cancels its checks that are still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.4"
  TFLINT_VERSION: "v0.64.0"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.tf_dir }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        tf_dir:
          - environments/global
          - environments/dev
          - environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ github.workspace }}/${{ matrix.tf_dir }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ github.workspace }}/${{ matrix.tf_dir }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # The token only raises the GitHub API rate limit for the plugin download.
      - name: TFLint Init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  discord-script:
    name: Discord setup script
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: scripts/discord
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: scripts/discord/uv.lock

      - run: uv run --locked ruff format --check
      - run: uv run --locked ruff check
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q
